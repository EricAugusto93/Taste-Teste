name: CI/CD Pipeline - Taste App

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

env:
  FLUTTER_VERSION: '3.24.0'
  JAVA_VERSION: '17'

jobs:
  # Job 1: Análise de código e testes
  test:
    name: 🧪 Tests & Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: ☕ Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}
        
    - name: 🐦 Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
        cache: true
        
    - name: 📦 Get dependencies
      run: flutter pub get
      
    - name: 🔍 Analyze code
      run: flutter analyze
      
    - name: 🧪 Run tests
      run: flutter test --coverage
      
    - name: 📊 Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: coverage/lcov.info
        fail_ci_if_error: false

  # Job 2: Build Android
  build-android:
    name: 🤖 Build Android
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'release'
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: ☕ Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}
        
    - name: 🐦 Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
        cache: true
        
    - name: 📦 Get dependencies
      run: flutter pub get
      
    - name: 🔐 Setup Android signing
      if: github.event_name == 'release'
      run: |
        echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 --decode > android/app/keystore.jks
        echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
        echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
        echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
        echo "storeFile=keystore.jks" >> android/key.properties
        
    - name: 🏗️ Build APK (Debug)
      if: github.event_name == 'push'
      run: flutter build apk --debug --flavor development
      
    - name: 🏗️ Build APK (Release)
      if: github.event_name == 'release'
      run: flutter build apk --release --flavor production --dart-define=ENVIRONMENT=production
      
    - name: 🏗️ Build App Bundle (Release)
      if: github.event_name == 'release'
      run: flutter build appbundle --release --flavor production --dart-define=ENVIRONMENT=production
      
    - name: 📤 Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: build/app/outputs/flutter-apk/*.apk
        
    - name: 📤 Upload Bundle artifact
      if: github.event_name == 'release'
      uses: actions/upload-artifact@v4
      with:
        name: android-bundle
        path: build/app/outputs/bundle/productionRelease/*.aab

  # Job 3: Build iOS
  build-ios:
    name: 🍎 Build iOS
    runs-on: macos-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'release'
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🐦 Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
        cache: true
        
    - name: 📦 Get dependencies
      run: flutter pub get
      
    - name: 📱 Setup iOS dependencies
      run: |
        cd ios
        pod install
        
    - name: 🔐 Setup iOS signing
      if: github.event_name == 'release'
      run: |
        # Configure iOS signing certificates and provisioning profiles
        # This requires additional setup with Apple Developer certificates
        echo "iOS signing setup would go here"
        
    - name: 🏗️ Build iOS (Debug)
      if: github.event_name == 'push'
      run: flutter build ios --debug --no-codesign
      
    - name: 🏗️ Build iOS (Release)
      if: github.event_name == 'release'
      run: flutter build ios --release --flavor production --dart-define=ENVIRONMENT=production
      
    - name: 📤 Upload iOS artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-build
        path: build/ios/iphoneos/*.app

  # Job 4: Build Web
  build-web:
    name: 🌐 Build Web
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'release'
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🐦 Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
        cache: true
        
    - name: 📦 Get dependencies
      run: flutter pub get
      
    - name: 🏗️ Build Web
      run: flutter build web --release --dart-define=ENVIRONMENT=production
      
    - name: 📤 Upload Web artifact
      uses: actions/upload-artifact@v4
      with:
        name: web-build
        path: build/web/
        
    - name: 🚀 Deploy to GitHub Pages
      if: github.event_name == 'release'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: build/web

  # Job 5: Deploy to stores (apenas em releases)
  deploy:
    name: 🚀 Deploy to Stores
    runs-on: ubuntu-latest
    needs: [build-android, build-ios, build-web]
    if: github.event_name == 'release'
    
    steps:
    - name: 📥 Download Android Bundle
      uses: actions/download-artifact@v4
      with:
        name: android-bundle
        path: ./android-bundle/
        
    - name: 🤖 Deploy to Google Play Store
      uses: r0adkll/upload-google-play@v1
      with:
        serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
        packageName: com.taste.app.production
        releaseFiles: android-bundle/*.aab
        track: internal # ou 'production' para release público
        status: completed
        
    - name: 🍎 Deploy to App Store
      # Requires additional setup with App Store Connect API
      run: |
        echo "App Store deployment would require additional setup"
        echo "Consider using fastlane or App Store Connect API"

  # Job 6: Notificações
  notify:
    name: 📢 Notify
    runs-on: ubuntu-latest
    needs: [test, build-android, build-ios, build-web]
    if: always()
    
    steps:
    - name: 📢 Notify success
      if: ${{ needs.test.result == 'success' && needs.build-android.result == 'success' }}
      run: |
        echo "✅ Build completed successfully!"
        # Aqui você pode adicionar notificações para Slack, Discord, etc.
        
    - name: 📢 Notify failure
      if: ${{ needs.test.result == 'failure' || needs.build-android.result == 'failure' }}
      run: |
        echo "❌ Build failed!"
        # Aqui você pode adicionar notificações de falha